name: Check External Links

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cloudflare-workers-monochrome

permissions:
  contents: read

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check external links with Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--verbose --no-progress --scheme http --scheme https ./content"
          fail: false
          jobSummary: true
