name: Check External Links

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  link-checker:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.170.1"
      DART_SASS_VERSION: "1.108.2"
      HUGO_ENVIRONMENT: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Hugo Extended
        run: |
          mkdir -p "${RUNNER_TEMP}/hugo"
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/hugo" hugo
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/hugo/hugo" version

      - name: Install Dart Sass
        run: |
          curl -fsSL "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/dart-sass" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/dart-sass/sass" --version

      - name: Build with Hugo
        run: hugo --gc --minify --baseURL /

      - name: Check links with Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--verbose --no-progress --root-dir ${{ github.workspace }}/public --exclude-path public/archive --exclude-path index.json --exclude-path sitemap.xml --exclude-path index.xml ./public"
          fail: false
          jobSummary: true
