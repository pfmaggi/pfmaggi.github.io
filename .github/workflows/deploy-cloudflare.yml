name: Deploy Hugo site to Cloudflare Workers

on:
  push:
    branches:
      - main
      - feat/cloudflare-workers-monochrome
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "cloudflare-workers-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.170.1"
      DART_SASS_VERSION: "1.108.2"
      HUGO_ENVIRONMENT: production
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://pietromaggi-blog.pfm.workers.dev/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo Extended
        run: |
          mkdir -p "${RUNNER_TEMP}/hugo"
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/hugo" hugo
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/hugo/hugo" version

      - name: Install Dart Sass
        run: |
          curl -fsSL "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/dart-sass" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/dart-sass/sass" --version

      - name: Build with Hugo
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${SITE_BASE_URL}"

      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
